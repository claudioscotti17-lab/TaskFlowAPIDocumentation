
openapi: 3.0.3

info:
  title: TaskFlow API
  version: 1.0.0
  description: |
    TaskFlow is a REST API for managing projects
    and their associated tasks.

    Create projects, add tasks, track progress,
    and manage task lifecycles.

servers:
  - url: https://test-writechoice.onrender.com
    description: TaskFlow API server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key authentication using a Bearer token.


paths:
  /projects:
    post:
      summary: Create a project
      description: |
        Creates a new project to organize related tasks.
        A project must exist before tasks can be added to it.
      operationId: createProject
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the project.
                  example: API Documentation Revamp
                description:
                  type: string
                  description: Description of the project.
                  example: Technical documentation validation project
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid or missing request body.
          content:
            application/json:
              example:
                error: Bad Request
                message: The 'name' field is required and must be a non-empty string.
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              example:
                error: Unauthorized
                message: Missing or invalid API key.
